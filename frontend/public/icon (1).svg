  <!-- needle -->
  <path d="M256 150 L286 256 L256 362 L226 256 Z" fill="url(#mark)"/>
  <circle cx="256" cy="256" r="20" fill="#0f172a"/>
  <circle cx="256" cy="256" r="9" fill="url(#mark)"/>

  <!-- AI spark, top-right -->
  <g transform="translate(358,120)">
    <path d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#ffffff"/>
  </g>
